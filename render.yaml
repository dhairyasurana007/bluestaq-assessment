services:
  - type: web
    name: team-notes-api
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: DATABASE_URL
        value: sqlite:///./notes.db
