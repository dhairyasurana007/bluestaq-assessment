<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Team Notes</title>
<script>
  /* Apply a saved theme before first paint to avoid a flash. */
  try {
    var savedTheme = localStorage.getItem('tn-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', savedTheme);
    }
  } catch (e) { /* storage unavailable: follow the system theme */ }
</script>
<style>
  /* ---------- design tokens ---------- */
  :root {
    color-scheme: light;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --bg: #fafafa;
    --surface: #ffffff;
    --surface-2: #f4f4f5;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --text: #18181b;
    --text-2: #52525b;
    --text-3: #71717a;

    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-soft: #eff4ff;
    --accent-text: #ffffff;
    --ring: rgba(37, 99, 235, .28);

    --danger: #dc2626;
    --danger-soft: #fef2f2;
    --danger-strong: #dc2626;
    --success: #15803d;
    --success-soft: #f0fdf4;
    --warn-bg: #fffbeb;
    --warn-border: #f59e0b;
    --warn-text: #92400e;

    --av-l: 38%;
    --scrim: rgba(9, 9, 11, .45);
    --shadow-1: 0 1px 2px rgba(24, 24, 27, .05);
    --shadow-2: 0 1px 2px rgba(24, 24, 27, .05), 0 4px 14px rgba(24, 24, 27, .07);
    --shadow-3: 0 2px 6px rgba(24, 24, 27, .06), 0 12px 32px rgba(24, 24, 27, .14);

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
    --fs-xs: 13px; --fs-sm: 14px; --fs-md: 16px; --fs-lg: 20px; --fs-xl: 28px;
    --r-sm: 8px; --r: 10px; --r-lg: 12px;
    --topbar-h: 56px;
    --t: 150ms ease;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #09090b;
      --surface: #111113;
      --surface-2: #1a1a1d;
      --border: #27272a;
      --border-strong: #3f3f46;
      --text: #fafafa;
      --text-2: #a1a1aa;
      --text-3: #8d8d96;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --accent-soft: rgba(96, 165, 250, .12);
      --accent-text: #0a0a0b;
      --ring: rgba(96, 165, 250, .35);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, .12);
      --success: #4ade80;
      --success-soft: rgba(74, 222, 128, .1);
      --warn-bg: rgba(245, 158, 11, .1);
      --warn-border: #b45309;
      --warn-text: #fcd34d;
      --av-l: 42%;
      --scrim: rgba(0, 0, 0, .6);
      --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-2: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .35);
      --shadow-3: 0 2px 6px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #09090b;
    --surface: #111113;
    --surface-2: #1a1a1d;
    --border: #27272a;
    --border-strong: #3f3f46;
    --text: #fafafa;
    --text-2: #a1a1aa;
    --text-3: #8d8d96;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --accent-soft: rgba(96, 165, 250, .12);
    --accent-text: #0a0a0b;
    --ring: rgba(96, 165, 250, .35);
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, .12);
    --success: #4ade80;
    --success-soft: rgba(74, 222, 128, .1);
    --warn-bg: rgba(245, 158, 11, .1);
    --warn-border: #b45309;
    --warn-text: #fcd34d;
    --av-l: 42%;
    --scrim: rgba(0, 0, 0, .6);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 1px 2px rgba(0, 0, 0, .4), 0 4px 14px rgba(0, 0, 0, .35);
    --shadow-3: 0 2px 6px rgba(0, 0, 0, .4), 0 12px 32px rgba(0, 0, 0, .5);
  }

  /* ---------- base ---------- */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scrollbar-gutter: stable; }
  body {
    margin: 0; min-width: 320px;
    background: var(--bg); color: var(--text);
    font: var(--fs-sm)/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
  }
  [hidden] { display: none !important; }
  h1, h2, h3, p { margin: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--text-2); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .ico { display: inline-flex; flex: none; }
  .ico svg {
    width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .skip {
    position: absolute; left: var(--s3); top: -48px; z-index: 100; padding: var(--s2) var(--s3);
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm);
  }
  .skip:focus { top: var(--s2); }

  /* ---------- buttons and inputs ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
    height: 36px; padding: 0 var(--s3);
    font-size: var(--fs-sm); font-weight: 500; line-height: 1; white-space: nowrap;
    color: var(--text); background: var(--surface);
    border: 1px solid var(--border-strong); border-radius: var(--r-sm);
    box-shadow: var(--shadow-1); cursor: pointer;
    transition: background-color var(--t), border-color var(--t), color var(--t),
      box-shadow var(--t), transform var(--t);
  }
  .btn:hover { background: var(--surface-2); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; transform: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); }
  .btn.danger-solid { background: var(--danger-strong); border-color: var(--danger-strong); color: #fff; }
  .btn.danger-solid:hover { filter: brightness(.92); }
  .btn.ghost { background: transparent; border-color: transparent; box-shadow: none; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.ghost.danger:hover { background: var(--danger-soft); }
  .btn.sm { height: 30px; font-size: var(--fs-xs); padding: 0 var(--s3); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 36px; height: 36px; padding: 0; color: var(--text-2);
    background: transparent; border: 1px solid transparent; border-radius: var(--r-sm);
    cursor: pointer; transition: background-color var(--t), color var(--t);
  }
  .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--surface-2); color: var(--text); }
  .icon-btn.sm { width: 28px; height: 28px; }
  .only-mobile { display: none; }

  .input {
    width: 100%; height: 36px; padding: 0 var(--s3);
    font: inherit; font-size: var(--fs-sm); color: var(--text);
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: var(--r-sm);
    transition: border-color var(--t), box-shadow var(--t);
  }
  .input::placeholder { color: var(--text-3); }
  .input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .input[aria-invalid="true"] { border-color: var(--danger); }
  label.label { display: block; margin: var(--s4) 0 var(--s1); font-size: var(--fs-xs); font-weight: 600; }
  .field-foot {
    display: flex; justify-content: space-between; gap: var(--s3); min-height: 20px;
    font-size: var(--fs-xs); color: var(--text-3);
  }
  .field-error { color: var(--danger); }
  .counter.over { color: var(--danger); }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30; height: var(--topbar-h);
    display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s5);
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  @supports (backdrop-filter: blur(8px)) {
    .topbar {
      background: color-mix(in srgb, var(--surface) 82%, transparent);
      backdrop-filter: saturate(160%) blur(10px);
    }
  }
  .brand { display: inline-flex; align-items: center; gap: var(--s2); color: var(--text); font-weight: 650; }
  .brand:hover { text-decoration: none; }
  .brand svg { width: 24px; height: 24px; }
  .badge {
    display: inline-flex; align-items: center; height: 22px; padding: 0 var(--s2);
    font-size: 12px; font-weight: 600; letter-spacing: .02em; white-space: nowrap;
    color: var(--warn-text); background: var(--warn-bg);
    border: 1px solid var(--warn-border); border-radius: 999px;
  }
  .top-spacer { flex: 1; }
  .top-links { display: flex; gap: var(--s1); }
  .top-links a {
    padding: var(--s1) var(--s3); color: var(--text-2); border-radius: var(--r-sm);
    transition: background-color var(--t), color var(--t);
  }
  .top-links a:hover { color: var(--text); background: var(--surface-2); text-decoration: none; }
  #progress {
    position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 90; overflow: hidden;
    background: var(--ring);
  }
  #progress::after {
    content: ""; display: block; width: 40%; height: 100%; background: var(--accent);
    animation: indeterminate 1.1s ease-in-out infinite;
  }
  @keyframes indeterminate { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  /* ---------- shell and sidebar ---------- */
  .shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); }
  .sidebar {
    position: sticky; top: var(--topbar-h); align-self: start;
    height: calc(100vh - var(--topbar-h)); height: calc(100dvh - var(--topbar-h));
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border-right: 1px solid var(--border);
  }
  .side-head {
    display: flex; align-items: center; justify-content: space-between; gap: var(--s2);
    padding: var(--s4) var(--s4) var(--s3);
  }
  .side-head h2 { font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3); }
  .team-list { list-style: none; margin: 0; padding: 0 var(--s2); flex: 1; overflow-y: auto; }
  .team-row { position: relative; margin-bottom: 2px; }
  .team-btn {
    display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 40px;
    padding: var(--s1) 44px var(--s1) var(--s2); text-align: left;
    background: transparent; border: 0; border-radius: var(--r-sm); cursor: pointer;
    transition: background-color var(--t);
  }
  .team-btn:hover { background: var(--surface-2); }
  .team-row.active .team-btn { background: var(--accent-soft); }
  .team-row.active .team-name { font-weight: 600; }
  .team-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { font-size: var(--fs-xs); color: var(--text-3); }
  .team-row .count { position: absolute; right: var(--s3); top: 50%; transform: translateY(-50%); pointer-events: none; }
  .row-menu { position: absolute; right: var(--s2); top: 50%; transform: translateY(-50%); opacity: 0; }
  .team-row:hover .row-menu, .team-row:focus-within .row-menu, .row-menu[aria-expanded="true"] { opacity: 1; }
  .team-row:hover .count, .team-row:focus-within .count { visibility: hidden; }
  @media (hover: none) {
    .row-menu { opacity: 1; }
    .team-row .count { visibility: hidden; }
  }
  .side-foot { padding: var(--s4); border-top: 1px solid var(--border); font-size: var(--fs-xs); color: var(--text-3); }
  .side-foot .side-links { display: none; gap: var(--s4); margin-bottom: var(--s2); font-size: var(--fs-sm); }
  #scrim { position: fixed; inset: 0; z-index: 35; background: var(--scrim); }

  /* ---------- avatars ---------- */
  .avatar {
    display: inline-flex; align-items: center; justify-content: center; flex: none;
    width: 28px; height: 28px; border-radius: var(--r-sm);
    font-size: 12px; font-weight: 650; line-height: 1; letter-spacing: .02em; color: #fff;
    background: hsl(var(--h, 215) 42% var(--av-l));
  }
  .avatar.xs { width: 20px; height: 20px; font-size: 10px; border-radius: 6px; }
  .avatar.lg { width: 44px; height: 44px; font-size: var(--fs-md); border-radius: var(--r); }

  /* ---------- main ---------- */
  main { min-width: 0; padding: var(--s5) var(--s6) var(--s7); outline: none; }
  .team-head { display: flex; align-items: center; gap: var(--s3); min-width: 0; }
  .team-head h1 { flex: 1; min-width: 0; font-size: var(--fs-xl); line-height: 1.2; font-weight: 650; letter-spacing: -.01em; }
  .title-btn {
    max-width: 100%; padding: var(--s1) var(--s2); margin: 0 calc(var(--s2) * -1);
    font: inherit; letter-spacing: inherit; text-align: left; overflow-wrap: anywhere;
    background: transparent; border: 0; border-radius: var(--r-sm); cursor: text;
    transition: background-color var(--t);
  }
  .title-btn:hover { background: var(--surface-2); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s3); margin: var(--s5) 0 var(--s4); }
  .seg {
    display: inline-flex; gap: 2px; padding: 3px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm);
  }
  .seg button {
    display: inline-flex; align-items: center; gap: var(--s2); height: 28px; padding: 0 var(--s3);
    font-size: var(--fs-sm); font-weight: 500; color: var(--text-2);
    background: transparent; border: 0; border-radius: 6px; cursor: pointer;
    transition: background-color var(--t), color var(--t), box-shadow var(--t);
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-selected="true"] { color: var(--text); background: var(--surface); box-shadow: var(--shadow-1), 0 0 0 1px var(--border); }
  .search { position: relative; flex: 1 1 220px; max-width: 360px; }
  .search .ico { position: absolute; left: var(--s3); top: 9px; color: var(--text-3); pointer-events: none; }
  .search .input { padding-left: 36px; }
  #new-note-btn { margin-left: auto; }

  /* ---------- cards ---------- */
  .grid {
    list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s4);
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 17.5rem), 1fr));
  }
  .card {
    display: flex; flex-direction: column; gap: var(--s2); width: 100%; height: 100%; min-height: 164px;
    padding: var(--s4); text-align: left; color: inherit;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
    box-shadow: var(--shadow-1);
  }
  button.card { cursor: pointer; transition: border-color var(--t), box-shadow var(--t), transform var(--t); }
  button.card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-2); transform: translateY(-1px); }
  button.card:active { transform: none; }
  .card-title, .card-body {
    display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere;
  }
  .card-title { -webkit-line-clamp: 2; line-clamp: 2; font-size: var(--fs-md); font-weight: 600; line-height: 1.35; }
  .card-body { -webkit-line-clamp: 3; line-clamp: 3; flex: 1; color: var(--text-2); }
  .card-body.none { font-style: italic; color: var(--text-3); }
  .card-foot { display: flex; align-items: center; gap: var(--s2); min-height: 24px; font-size: var(--fs-xs); color: var(--text-3); }
  .card-foot .author { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-2); }
  .card-foot .author span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-foot .grow { flex: 1; min-width: 0; }
  .pill {
    display: inline-flex; align-items: center; height: 20px; padding: 0 6px;
    font-size: 12px; font-weight: 600; color: var(--text-2);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
  }
  .card.trash { background: var(--surface-2); box-shadow: none; }
  .card.trash .card-title { color: var(--text-2); }
  .card.skeleton { gap: var(--s3); }
  .skel {
    height: 14px; border-radius: 6px;
    background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
  }
  .skel.w40 { width: 40%; } .skel.w60 { width: 60%; } .skel.w90 { width: 90%; } .skel.row { height: 28px; border-radius: var(--r-sm); margin: 0 0 var(--s2); }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* ---------- empty states ---------- */
  .span-all { grid-column: 1 / -1; }
  .empty {
    display: flex; flex-direction: column; align-items: center; gap: var(--s2);
    max-width: 26rem; margin: var(--s7) auto; padding: 0 var(--s4); text-align: center;
  }
  .empty h3 { font-size: var(--fs-lg); font-weight: 650; }
  .empty p { color: var(--text-2); margin-bottom: var(--s3); }
  .empty.compact { margin: var(--s6) auto; }
  .illus svg { width: 120px; height: 96px; margin-bottom: var(--s2); }
  .i-fill { fill: var(--surface-2); stroke: var(--border-strong); stroke-width: 1.5; }
  .i-accent { fill: var(--accent); }
  .i-line { fill: var(--border-strong); }
  .i-stroke { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }

  /* ---------- menu ---------- */
  .menu {
    position: fixed; z-index: 60; min-width: 176px; padding: var(--s1);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
    box-shadow: var(--shadow-3);
  }
  .menu button {
    display: flex; align-items: center; gap: var(--s2); width: 100%; height: 32px; padding: 0 var(--s3);
    text-align: left; background: none; border: 0; border-radius: 6px; cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: none; }
  .menu button.danger { color: var(--danger); }
  .menu button.danger:hover, .menu button.danger:focus-visible { background: var(--danger-soft); }

  /* ---------- dialogs ---------- */
  dialog { padding: 0; border: 0; color: var(--text); background: var(--surface); max-width: none; max-height: none; }
  dialog::backdrop { background: var(--scrim); }
  .sheet {
    margin: 0 0 0 auto; width: min(680px, 100vw); height: 100vh; height: 100dvh;
    border-left: 1px solid var(--border); box-shadow: var(--shadow-3);
  }
  .sheet[open] { display: flex; flex-direction: column; animation: slide-in 180ms ease-out; }
  .sheet form { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .sheet-head {
    display: flex; align-items: center; gap: var(--s3); padding: var(--s4) var(--s5);
    border-bottom: 1px solid var(--border);
  }
  .sheet-head > div { flex: 1; min-width: 0; }
  .sheet-head h2 { font-size: var(--fs-md); font-weight: 650; }
  .sheet-meta { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); font-size: var(--fs-xs); color: var(--text-3); min-height: 22px; }
  .dirty { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); color: var(--warn-text); }
  .dirty::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--warn-border); }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--s5); }
  .sheet-foot {
    display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding: var(--s3) var(--s5);
    border-top: 1px solid var(--border); background: var(--surface);
  }
  .sheet-foot .spacer { flex: 1; }
  .sheet-foot .hint { font-size: var(--fs-xs); color: var(--text-3); }
  .title-input {
    width: 100%; padding: var(--s1) 0; font: inherit; font-size: var(--fs-lg); font-weight: 650;
    line-height: 1.3; color: var(--text); background: transparent; border: 0; border-radius: 0;
  }
  .title-input::placeholder { color: var(--text-3); font-weight: 500; }
  .title-input:focus-visible { outline: none; box-shadow: 0 2px 0 0 var(--accent); }
  .body-input {
    display: block; width: 100%; min-height: 40vh; padding: var(--s3) var(--s4); resize: none; overflow: hidden;
    font: inherit; font-size: var(--fs-md); line-height: 1.6; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
    transition: border-color var(--t), box-shadow var(--t);
  }
  .body-input:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--ring); }
  .modal {
    margin: auto; width: min(420px, calc(100vw - 32px)); padding: var(--s5);
