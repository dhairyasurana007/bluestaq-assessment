[alembic]
script_location = %(here)s/migrations
# The `alembic` console script (used by the Render start command) does not put the
# working directory on sys.path, unlike `python -m alembic`; env.py imports `app`.
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally not set: migrations/env.py falls back to
# Settings().database_url (env DATABASE_URL) when it is not provided programmatically.
