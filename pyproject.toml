[project]
name = "team-notes-api"
version = "0.1.0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*.md", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
